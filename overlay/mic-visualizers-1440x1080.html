<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440, height=1080">
<title>Timbre — 4:3 (1440×1080, fits any size)</title>
<link rel="stylesheet" href="timbre.css">

<script src="vendor/three.min.js"></script>
<style>
  /* 4.8× scale of mic-visualizers-300x220.html (300×220 → 1440×1080, 4:3).

     FITS ANY SIZE: the box is laid out at 1440×1080 and then CSS-scaled (see the
     fit script at the bottom) to the viewport — i.e. to whatever width/height the OBS
     Browser Source is set to. 960×720, 720×540, 480×360 … all use this one page;
     a non-4:3 source letterboxes it centred. The canvas keeps rendering at 1248×624
     and is downscaled, so small sources stay sharp and effect geometry never changes. */
  :root { --dark-base: rgba(10, 10, 26, 0.88); }
  html, body { width: 100%; height: 100%; }

  .visualizer-box {
    width: 1440px;
    height: 1080px;
    transform-origin: 0 0;
    font-family: 'Audiowide', cursive;
    background: var(--dark-base);
    border: 10px solid var(--cyan);
    border-radius: 29px;
    overflow: hidden;
    box-shadow:
      0 0 96px 19px rgba(0, 255, 255, 0.5),
      0 0 240px 48px rgba(0, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 115px;
    gap: 19px;
    position: relative;
  }

  .visualizer-box.no-border {
    border: 0;
    box-shadow: none;
    padding-top: 0;
    gap: 0;
  }
  .visualizer-box.no-border .canvas-stack {
    width: 100%;
    height: 100%;
  }
  .visualizer-box.no-border .viz-label,
  .visualizer-box.no-border .viz-status,
  .visualizer-box.no-border .viz-ticks,
  .visualizer-box.no-border .chevron-track {
    display: none;
  }

  .viz-label {
    font-size: 67px;
    font-weight: 700;
    letter-spacing: 29px;
    color: var(--cyan);
    opacity: 0.9;
    z-index: 1;
  }

  .viz-status {
    font-size: 48px;
    font-weight: 400;
    letter-spacing: 10px;
    color: rgba(255, 255, 255, 0.5);
    z-index: 1;
    height: 67px;
  }

  .canvas-stack {
    position: relative;
    width: 1248px;
    height: 624px;
    z-index: 1;
  }
  .canvas-stack canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* When the page is scaled below 1:1, nearest-neighbour downsampling would drop
     thin rows/columns and shimmer on motion — let the GPU filter the downscale. */
  .visualizer-box.scaled .canvas-stack canvas { image-rendering: auto; }

  .viz-ticks {
    display: flex;
    gap: 14px;
    z-index: 1;
    margin-top: 10px;
  }
  .viz-ticks .tick {
    width: 14px;
    height: 10px;
    opacity: 0.2;
    background: var(--cyan);
  }
  .viz-ticks .tick:nth-child(5n) {
    background: var(--magenta);
    opacity: 0.35;
  }

  /* Chevron decoration — scaled 4.8× from timbre.css defaults. */
  .chevron-track { left: 96px; right: 96px; height: 29px; }
  .chevron-track.top { top: 77px; }
  .chevron-track.bottom { bottom: 58px; }
  .chevron-strip { gap: 29px; }
  .chevron-tick.large { width: 29px; height: 19px; }
  .chevron-tick.small { width: 14px; height: 10px; margin-top: 5px; }
</style>
</head>
<body>

  <div class="visualizer-box">
    <div class="chevron-track top"><div class="chevron-strip left" id="chevronTop"></div></div>

    <span class="viz-label">AUDIO</span>
    <span class="viz-status" id="vizStatus">WAITING</span>
    <div class="canvas-stack" id="canvasStack">
      <canvas id="vizCanvas2D" width="1248" height="624"></canvas>
      <canvas id="vizCanvas3D" width="1248" height="624" style="display:none"></canvas>
    </div>
    <div class="viz-ticks" id="vizTicks"></div>

    <div class="chevron-track bottom"><div class="chevron-strip right" id="chevronBottom"></div></div>
  </div>

<script>
  /* Override setCanvasHeight to scale core.js's hardcoded heights (130/170/180)
     by 4.8× so decoration toggles resize the canvas to match this layout. */
  (function () {
    const SCALE = 4.8;
    const _origSet = window.setCanvasHeight;
    window.setCanvasHeight = function (h) { _origSet(Math.round(h * SCALE)); };
  })();

  /* Fit-to-viewport: scale the fixed 1440×1080 layout to the Browser Source size,
     centred (letterboxed) if the source isn't 4:3. Uniform scale only — the
     layout, canvas buffers and SCALE are untouched, so every effect looks identical
     at every size. core.js measures layout (offsetHeight), not screen rects, so the
     no-border branch still sees the untransformed 1080px. */
  (function () {
    const box = document.querySelector('.visualizer-box');
    function fit() {
      const vw = window.innerWidth, vh = window.innerHeight;
      let s = Math.min(vw / 1440, vh / 1080);
      if (!(s > 0)) s = 1; // headless/zero-size viewports: leave unscaled
      const ox = Math.floor((vw - 1440 * s) / 2), oy = Math.floor((vh - 1080 * s) / 2);
      box.style.transform = `translate(${ox}px, ${oy}px) scale(${s})`;
      box.classList.toggle('scaled', s < 0.999);
      window.__timbreFit = s;
    }
    window.addEventListener('resize', fit);
    fit();
  })();

  /* Bootstrap — runs after every factory has registered itself. */
  setActiveViz('visualizer');
  timbreCapture.start();
  requestAnimationFrame(frame);
</script>

<!-- Streamer.bot transport — connects, subscribes, DoActions "Timbre Push" for sync. -->
