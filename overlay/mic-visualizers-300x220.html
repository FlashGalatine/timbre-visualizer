<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=300, height=220">
<title>Timbre — 300×220</title>
<link rel="stylesheet" href="timbre.css">
<script src="/timbre-shared/viz-config.js"></script>
<script src="vendor/three.min.js"></script>
<style>
  :root { --dark-base: rgba(10, 10, 26, 0.88); }
  body { width: 300px; height: 220px; }

  .visualizer-box {
    width: 300px;
    height: 220px;
    font-family: 'Audiowide', cursive;
    background: var(--dark-base);
    border: 2px solid var(--cyan);
    border-radius: 6px;
    overflow: hidden;
    box-shadow:
      0 0 20px 4px rgba(0, 255, 255, 0.5),
      0 0 50px 10px rgba(0, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 24px;
    gap: 4px;
    position: relative;
  }

  .visualizer-box.no-border {
    border: 0;
    box-shadow: none;
    padding-top: 0;
    gap: 0;
  }
  .visualizer-box.no-border .canvas-stack {
    width: 100%;
    height: 100%;
  }
  .visualizer-box.no-border .viz-label,
  .visualizer-box.no-border .viz-status,
  .visualizer-box.no-border .viz-ticks,
  .visualizer-box.no-border .chevron-track {
    display: none;
  }

  .viz-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--cyan);
    opacity: 0.9;
    z-index: 1;
  }

  .viz-status {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    z-index: 1;
    height: 14px;
  }

  .canvas-stack {
    position: relative;
    width: 260px;
    height: 130px;
    z-index: 1;
  }
  /* Canvases fill the stack wrapper so decoration toggles resize both
     the wrapper height (display) and canvas.height (drawing buffer) without distortion. */
  .canvas-stack canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .viz-ticks {
    display: flex;
    gap: 3px;
    z-index: 1;
    margin-top: 2px;
  }
  .viz-ticks .tick {
    width: 3px;
    height: 2px;
    opacity: 0.2;
    background: var(--cyan);
  }
  .viz-ticks .tick:nth-child(5n) {
    background: var(--magenta);
    opacity: 0.35;
  }
</style>
</head>
<body>

  <div class="visualizer-box">
    <div class="chevron-track top"><div class="chevron-strip left" id="chevronTop"></div></div>

    <span class="viz-label">AUDIO</span>
    <span class="viz-status" id="vizStatus">WAITING</span>
    <div class="canvas-stack" id="canvasStack">
      <canvas id="vizCanvas2D" width="260" height="130"></canvas>
      <canvas id="vizCanvas3D" width="260" height="130" style="display:none"></canvas>
    </div>
    <div class="viz-ticks" id="vizTicks"></div>

    <div class="chevron-track bottom"><div class="chevron-strip right" id="chevronBottom"></div></div>
  </div>

<!-- Shared infrastructure: palette, canvas refs, config apply, anim loop, viz registry. -->
<script src="core.js"></script>
<script src="scene-kit.js"></script>

<!-- 2D visualizer factories (canvas2d). Each registers itself in VIZ_FACTORIES. -->
<script src="factories/visualizer.js"></script>

<script src="factories/spectrogram.js"></script>
<script src="factories/dna.js"></script>
<script src="factories/fireflies.js"></script>
<script src="factories/pulse-rings.js"></script>
<script src="factories/matrix.js"></script>
<script src="factories/sine-bars.js"></script>
<script src="factories/mountains-2d.js"></script>
<script src="factories/vaporwave.js"></script>
<script src="factories/peaks-mirror.js"></script>
<script src="factories/galaxy-ripple.js"></script>
<script src="factories/tunnel.js"></script>
<script src="factories/spring-blossoms.js"></script>
<script src="factories/summer-tide.js"></script>
<script src="factories/autumn-leaves.js"></script>
<script src="factories/halloween-jack.js"></script>
<script src="factories/christmas-tree.js"></script>
<script src="factories/new-year-fireworks.js"></script>
<script src="factories/valentines-hearts.js"></script>
<script src="factories/easter-eggs.js"></script>
<script src="factories/st-patricks-shamrocks.js"></script>
<script src="factories/july-fourth-stripes.js"></script>
<script src="factories/thanksgiving-harvest.js"></script>
<script src="factories/lunar-new-year-lanterns.js"></script>
<script src="factories/pride-ribbon.js"></script>

<script src="factories/ace-pride-ribbon.js"></script>

<!-- 3D / WebGL factories (canvas3d). All depend on the THREE global loaded above. -->
<script src="factories/mountains-3d.js"></script>
<script src="factories/sunburst-3d.js"></script>
<script src="factories/metaball.js"></script>
<script src="factories/glass-prism.js"></script>
<script src="factories/chladni.js"></script>
<script src="factories/phosphor.js"></script>
<script src="factories/ink.js"></script>
<script src="factories/shards.js"></script>
<script src="factories/jelly.js"></script>
<script src="factories/boids.js"></script>
<script src="factories/rose.js"></script>
<script src="factories/winter-aurora.js"></script>

<!-- Local mic capture (fills frequencies/waveform/micActive — no audio on the wire). -->
<script src="audio-capture.js"></script>

<script>
  /* Bootstrap — runs after every factory has registered itself. */
  setActiveViz('visualizer');
  timbreCapture.start();
  requestAnimationFrame(frame);
</script>

<!-- Streamer.bot transport — connects, subscribes, DoActions "Timbre Push" for sync. -->
<script src="/timbre-shared/panel-client-sb.js"></script>

</body>
</html>
